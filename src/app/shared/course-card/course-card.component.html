<div class="card h-100 course-card shadow-sm border-0">
  <div class="card-body d-flex flex-column">
    <div class="course-icon mb-3">
      <i class="bi {{ course.icon }}"></i>
    </div>

    <span class="badge rounded-pill mb-2 align-self-start" [ngClass]="levelBadgeClass">
      {{ course.level }}
    </span>

    <h5 class="card-title fw-bold">{{ course.title }}</h5>
    <p class="text-muted small mb-2">
      <i class="bi bi-tag me-1"></i>{{ course.category }}
      &middot;
      <i class="bi bi-clock ms-1 me-1"></i>{{ course.durationHours }} horas
    </p>
    <p class="card-text flex-grow-1">{{ course.description }}</p>

    <a [routerLink]="['/contacto']" class="btn btn-outline-primary mt-3 align-self-start">
      Más información
    </a>
  </div>
</div>
